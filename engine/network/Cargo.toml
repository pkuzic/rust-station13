[package]
name = "rs13-network"
description = "Network protocol, sessions and replication built on Lightyear."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rs13-core.workspace = true
rs13-world.workspace = true
lightyear = { workspace = true, features = ["std", "replication", "netcode", "udp"] }
bevy_app.workspace = true
bevy_ecs.workspace = true
serde.workspace = true

[features]
default = []
client = ["lightyear/client"]
server = ["lightyear/server"]
