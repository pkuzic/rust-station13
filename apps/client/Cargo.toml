[package]
name = "rs13-client"
description = "Universal player client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rs13-world.workspace = true
rs13-i18n.workspace = true
rs13-dmi-import.workspace = true
ron.workspace = true
# Only for its locale files, until locales are delivered by the server's asset manifest.
rs13-classic.workspace = true
rs13-network = { workspace = true, features = ["client"] }
# System fonts give Cyrillic text (Tahoma on Windows, DejaVu Sans on Linux).
bevy = { workspace = true, features = ["default", "system_font_discovery"] }
