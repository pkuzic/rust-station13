[package]
name = "rs13-headless"
description = "Headless scenario runner for automated tests and benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rs13-world.workspace = true
rs13-network = { workspace = true, features = ["client"] }
bevy = { workspace = true, features = ["std", "multi_threaded", "async_executor", "bevy_log", "bevy_state"] }

[dev-dependencies]
rs13-server.workspace = true
rs13-classic.workspace = true
